<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Học Tập - Lịch Sử Sự Kiện</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #34495e; --accent: #1abc9c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 1.5rem; text-align: center; }
        nav { background: var(--secondary); padding: 0.8rem; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; }
        nav a:hover { color: var(--accent); }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        pre { background: #333; color: #00ff00; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; line-height: 1.5;}
    </style>
</head>
<body>
    <header>
        <h1>🔔 Lịch Sử Hoạt Động</h1>
        <p>Phần 2: Ứng dụng EventEmitter</p>
    </header>
    
    <nav>
        <a href="/">🏠 Trang Chủ</a>
        <a href="/streams">✍️ Viết Nhật Ký</a>
        <a href="/events">🔔 Xem file Log</a>
    </nav>

    <div class="container">
        <h2>System Event Logs (EventEmitter)</h2>
        <pre id="log-container">Đang tải lịch sử sự kiện...</pre>
    </div>

    <script>
        // Lấy nội dung file log sự kiện
        fetch('/api/events')
            .then(res => res.text())
            .then(text => {
                document.getElementById('log-container').innerText = text || "Hệ thống chưa ghi nhận sự kiện nào.";
            });
    </script>
</body>
</html>
